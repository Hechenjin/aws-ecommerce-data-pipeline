name: Python and PySpark Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Data Quality and Spark Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.2.0 pyspark==4.1.1

      - name: Verify runtime
        run: |
          python --version
          java -version
          python -m pip show pyspark

      - name: Run all tests
        run: python -m pytest tests/ -v
